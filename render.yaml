services:
  - type: web
    name: coopsphere-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        fromService:
          name: coopsphere-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_BASE_URL
        fromService:
          name: coopsphere-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: coopsphere-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_URL="$BACKEND_URL/api/v1" npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        fromService:
          name: coopsphere-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
